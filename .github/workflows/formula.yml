name: Formula checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Register this checkout as the tap under test
        run: brew tap cliecy/tap "$GITHUB_WORKSPACE"
      - name: Audit and style formulae
        run: |
          brew audit --strict --new --online cliecy/tap/proxytop cliecy/tap/cc-switch-ui
          brew style --formula cliecy/tap/proxytop cliecy/tap/cc-switch-ui
      - name: Audit and style cask
        run: |
          brew audit --cask --strict --online cliecy/tap/proxytop-app
          brew style --cask cliecy/tap/proxytop-app

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Register this checkout as the tap under test
        run: brew tap cliecy/tap "$GITHUB_WORKSPACE"
      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install and test formulae
        run: |
          brew install --build-from-source cliecy/tap/proxytop
          brew test proxytop
          brew install --build-from-source cliecy/tap/cc-switch-ui
          brew test cc-switch-ui
      - name: Install and verify cask
        run: |
          brew install --cask cliecy/tap/proxytop-app
          test -d "/Applications/Proxytop.app"
          test -x "/Applications/Proxytop.app/Contents/Resources/proxytop"
